<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="760" viewBox="0 0 1660 760" role="img" aria-labelledby="title desc">
  <title id="title">LookAway method overview</title>
  <desc id="desc">A full-image student generates an on-policy trajectory. Aligned positive and negative crop teachers score the same tokens. Their contrast passes through four gates to reweight on-policy distillation.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 4 L0 8 z" fill="#0A0A0A"/>
    </marker>
    <style>
      .h1 { font-size: 34px; font-weight: 800; fill: #0A0A0A; letter-spacing: 1px; }
      .sub { font-size: 17px; font-weight: 500; fill: #333333; }
      .stage { font-size: 18px; font-weight: 800; fill: #0A0A0A; letter-spacing: .4px; }
      .body { font-size: 16px; font-weight: 500; fill: #333333; }
      .body-strong { font-size: 16px; font-weight: 750; fill: #0A0A0A; }
      .tiny { font-size: 14px; font-weight: 500; fill: #333333; }
      .formula { font-size: 17px; font-weight: 700; fill: #0A0A0A; }
      .white { fill: #FFFFFF; }
    </style>
  </defs>

  <rect x="1.5" y="1.5" width="1657" height="757" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>

  <!-- Header -->
  <rect x="0" y="0" width="20" height="112" fill="#0A0A0A"/>
  <text x="48" y="53" class="h1">LOOKAWAY</text>
  <text x="48" y="83" class="sub">Token-level counterfactual voting for visual on-policy self-distillation</text>

  <rect x="1098" y="28" width="176" height="38" fill="#E5EDD6" stroke="#0A0A0A" stroke-width="2"/>
  <text x="1115" y="53" class="body-strong">ALIGNED CROPS</text>
  <rect x="1288" y="28" width="150" height="38" fill="#F2D4CF" stroke="#0A0A0A" stroke-width="2"/>
  <text x="1307" y="53" class="body-strong">TOKEN LEVEL</text>
  <rect x="1452" y="28" width="158" height="38" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="2"/>
  <text x="1475" y="53" class="body-strong">ON POLICY</text>

  <line x1="20" y1="112" x2="1658" y2="112" stroke="#0A0A0A" stroke-width="3"/>

  <!-- Stage 01 -->
  <rect x="42" y="146" width="420" height="505" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  <rect x="42" y="146" width="64" height="54" fill="#0A0A0A"/>
  <text x="63" y="181" class="stage white">01</text>
  <text x="126" y="181" class="stage">ALIGNED VISUAL CONDITIONS</text>

  <rect x="72" y="226" width="360" height="116" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="2"/>
  <text x="91" y="254" class="body-strong">STUDENT · FULL IMAGE</text>
  <rect x="91" y="271" width="156" height="50" fill="#D9E9FA" stroke="#0A0A0A" stroke-width="2"/>
  <rect x="105" y="282" width="38" height="28" fill="#8AB7E8" stroke="#0A0A0A" stroke-width="1.5"/>
  <rect x="151" y="279" width="42" height="31" fill="#ABCDF0" stroke="#0A0A0A" stroke-width="1.5"/>
  <rect x="202" y="286" width="28" height="24" fill="#72A2D4" stroke="#0A0A0A" stroke-width="1.5"/>
  <text x="265" y="286" class="tiny">observes global context</text>
  <text x="265" y="309" class="tiny">samples y ~ pS</text>

  <rect x="72" y="370" width="170" height="206" fill="#E5EDD6" stroke="#0A0A0A" stroke-width="2"/>
  <text x="91" y="399" class="body-strong">POSITIVE</text>
  <text x="91" y="420" class="tiny">evidence region</text>
  <rect x="105" y="450" width="94" height="88" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
  <rect x="120" y="463" width="64" height="62" fill="#D5E9DD" stroke="#14996B" stroke-width="5"/>
  <circle cx="152" cy="494" r="12" fill="#59C89C" stroke="#0A0A0A" stroke-width="1.5"/>
  <text x="91" y="558" class="tiny">correct evidence</text>

  <rect x="262" y="370" width="170" height="206" fill="#F2D4CF" stroke="#0A0A0A" stroke-width="2"/>
  <text x="281" y="399" class="body-strong">NEGATIVE</text>
  <text x="281" y="420" class="tiny">displaced region</text>
  <rect x="300" y="450" width="94" height="88" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
  <rect x="315" y="463" width="64" height="62" fill="#F0DFDA" stroke="#E14F5D" stroke-width="5"/>
  <line x1="327" y1="479" x2="367" y2="519" stroke="#B56D72" stroke-width="3"/>
  <line x1="367" y1="479" x2="327" y2="519" stroke="#B56D72" stroke-width="3"/>
  <text x="281" y="554" class="tiny">wrong region</text>
  <text x="281" y="571" class="tiny">same geometry</text>

  <rect x="72" y="595" width="360" height="34" fill="#0A0A0A"/>
  <text x="93" y="618" class="tiny white">shared crop · bbox · 5 px frame · 2x resize</text>

  <!-- connector 01 to 02 -->
  <line x1="462" y1="399" x2="506" y2="399" stroke="#0A0A0A" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 02 -->
  <rect x="512" y="146" width="438" height="505" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  <rect x="512" y="146" width="64" height="54" fill="#0A0A0A"/>
  <text x="533" y="181" class="stage white">02</text>
  <text x="596" y="181" class="stage">SCORE THE SAME TRAJECTORY</text>

  <text x="542" y="238" class="body-strong">Student rollout</text>
  <rect x="542" y="256" width="60" height="43" fill="#D9E9FA" stroke="#0A0A0A" stroke-width="2"/>
  <text x="560" y="283" class="body-strong">y1</text>
  <rect x="617" y="256" width="60" height="43" fill="#D9E9FA" stroke="#0A0A0A" stroke-width="2"/>
  <text x="635" y="283" class="body-strong">y2</text>
  <rect x="692" y="256" width="60" height="43" fill="#D9E9FA" stroke="#0A0A0A" stroke-width="2"/>
  <text x="710" y="283" class="body-strong">y3</text>
  <text x="770" y="283" class="body-strong">...</text>
  <rect x="813" y="256" width="72" height="43" fill="#D9E9FA" stroke="#0A0A0A" stroke-width="2"/>
  <text x="837" y="283" class="body-strong">yt</text>

  <text x="542" y="342" class="body-strong">Three scores for each token</text>
  <rect x="542" y="362" width="378" height="48" fill="#EAF3FC" stroke="#0A0A0A" stroke-width="2"/>
  <rect x="542" y="362" width="10" height="48" fill="#4388CE"/>
  <text x="570" y="392" class="formula">log pS(yt | full image)</text>
  <rect x="542" y="421" width="378" height="48" fill="#E5EDD6" stroke="#0A0A0A" stroke-width="2"/>
  <rect x="542" y="421" width="10" height="48" fill="#31A878"/>
  <text x="570" y="451" class="formula">log p_pos(yt | positive crop)</text>
  <rect x="542" y="480" width="378" height="48" fill="#F2D4CF" stroke="#0A0A0A" stroke-width="2"/>
  <rect x="542" y="480" width="10" height="48" fill="#D95460"/>
  <text x="570" y="510" class="formula">log p_neg(yt | negative crop)</text>

  <rect x="542" y="552" width="378" height="70" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="2"/>
  <text x="564" y="581" class="body-strong">Counterfactual evidence signal</text>
  <text x="564" y="607" class="body">Delta_t = score_pos - score_neg</text>

  <!-- connector 02 to 03 -->
  <line x1="950" y1="399" x2="994" y2="399" stroke="#0A0A0A" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 03 -->
  <rect x="1000" y="146" width="618" height="505" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  <rect x="1000" y="146" width="64" height="54" fill="#0A0A0A"/>
  <text x="1021" y="181" class="stage white">03</text>
  <text x="1084" y="181" class="stage">VOTE, THEN REWEIGHT DISTILLATION</text>

  <text x="1030" y="238" class="body-strong">Eligibility funnel</text>
  <rect x="1030" y="258" width="266" height="54" fill="#E8E3F8" stroke="#0A0A0A" stroke-width="2"/>
  <rect x="1030" y="258" width="48" height="54" fill="#0A0A0A"/>
  <text x="1048" y="292" class="body-strong white">1</text>
  <text x="1096" y="282" class="body-strong">View dependence</text>
  <text x="1096" y="302" class="tiny">high |Delta_t|</text>

  <rect x="1044" y="326" width="238" height="54" fill="#E8E3F8" stroke="#0A0A0A" stroke-width="2"/>
  <rect x="1044" y="326" width="48" height="54" fill="#0A0A0A"/>
  <text x="1062" y="360" class="body-strong white">2</text>
  <text x="1110" y="350" class="body-strong">Word-rate prior</text>
  <text x="1110" y="370" class="tiny">content token</text>

  <rect x="1058" y="394" width="210" height="54" fill="#E8E3F8" stroke="#0A0A0A" stroke-width="2"/>
  <rect x="1058" y="394" width="48" height="54" fill="#0A0A0A"/>
  <text x="1076" y="428" class="body-strong white">3</text>
  <text x="1124" y="418" class="body-strong">Template filter</text>
  <text x="1124" y="438" class="tiny">drop boilerplate</text>

  <rect x="1072" y="462" width="182" height="54" fill="#E8E3F8" stroke="#0A0A0A" stroke-width="2"/>
  <rect x="1072" y="462" width="48" height="54" fill="#0A0A0A"/>
  <text x="1090" y="496" class="body-strong white">4</text>
  <text x="1138" y="486" class="body-strong">JSD gate</text>
  <text x="1138" y="506" class="tiny">student gap</text>

  <line x1="1298" y1="387" x2="1332" y2="387" stroke="#0A0A0A" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1338" y="259" width="246" height="260" fill="#E5EDD6" stroke="#0A0A0A" stroke-width="3"/>
  <text x="1363" y="297" class="stage">TOKEN WEIGHT</text>
  <text x="1363" y="331" class="formula">wt = base(Delta_t)</text>
  <text x="1363" y="352" class="formula">     + gated bonus</text>
  <line x1="1363" y1="371" x2="1559" y2="371" stroke="#0A0A0A" stroke-width="2"/>
  <text x="1363" y="405" class="body-strong">Reweighted OPD</text>
  <text x="1363" y="438" class="tiny">loss = sum_t wt * divergence_t</text>
  <text x="1363" y="472" class="body">Spend gradient budget on</text>
  <text x="1363" y="496" class="body">answer-bearing tokens.</text>

  <rect x="1030" y="550" width="554" height="72" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="2"/>
  <text x="1052" y="578" class="body-strong">Output</text>
  <text x="1122" y="578" class="body">same OPD objective · sharper evidence allocation</text>
  <text x="1052" y="605" class="tiny">negative view sets token weights; positive teacher remains the target</text>

  <!-- Footer -->
  <line x1="42" y1="686" x2="1618" y2="686" stroke="#0A0A0A" stroke-width="2"/>
  <text x="42" y="718" class="body-strong">Core question</text>
  <text x="170" y="718" class="body">Which response tokens truly depend on seeing the correct fine-grained evidence?</text>
  <rect x="1284" y="700" width="334" height="35" fill="#0A0A0A"/>
  <text x="1305" y="724" class="tiny white">controlled geometry · isolated token signal</text>
</svg>
